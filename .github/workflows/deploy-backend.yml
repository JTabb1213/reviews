# ─────────────────────────────────────────────────────────────────────────────
# Deploy backend2 → Google Artifact Registry → Cloud Run
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   GCP_SA_KEY        – Service-account JSON key (with roles: Cloud Run Admin,
#                       Artifact Registry Writer, Service Account User)
#   GCP_PROJECT_ID    – GCP project ID  (e.g. my-project-123)
#   GCP_REGION        – Deployment region (e.g. us-central1)
#
#   # Runtime env vars forwarded to Cloud Run:
#   REDIS_HOST / REDIS_PORT / REDIS_USERNAME / REDIS_PASSWORD
#   DB_HOST / DB_PORT / DB_USER / DB_PASSWORD / DB_NAME
#   GOOGLE_API_KEY
#   SESSION_SECRET
#   CORS_ORIGINS      – comma-separated (e.g. https://your-app.web.app)
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend2/**'
      - '.github/workflows/deploy-backend.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE: reviews-backend   # Cloud Run service name — change if needed
  AR_REPO: reviews           # Artifact Registry repository name — change if needed

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        id: build
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend:${{ github.sha }}"
          docker build -t "$IMAGE" ./backend2
          docker push "$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          image: ${{ steps.build.outputs.image }}
          region: ${{ env.REGION }}
          flags: --allow-unauthenticated
          env_vars: |
            NODE_ENV=production
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            REDIS_USERNAME=${{ secrets.REDIS_USERNAME }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
