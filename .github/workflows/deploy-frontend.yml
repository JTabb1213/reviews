# ─────────────────────────────────────────────────────────────────────────────
# Deploy frontend1 → Firebase Hosting (live channel)
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   FIREBASE_SERVICE_ACCOUNT – Firebase service-account JSON
#                              (generate in Firebase Console →
#                               Project Settings → Service accounts)
#   GCP_PROJECT_ID           – Firebase / GCP project ID
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Frontend to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'frontend1/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend1/package-lock.json

      - name: Install dependencies
        working-directory: frontend1
        run: npm ci

      - name: Build
        working-directory: frontend1
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          entryPoint: ./frontend1
